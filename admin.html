<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="referrer" content="no-referrer" />
  <title>Administração - Voto Escolar</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topo">
    <h1>Voto Escolar</h1>
    <p>Administração</p>
  </header>

  <main class="container largo">
    <p id="estado-admin" class="estado" role="status" aria-live="polite">Verificando acesso...</p>

    <!-- Login: único conteúdo visível sem autenticação -->
    <section class="cartao cartao-login" id="secao-login" hidden>
      <h2>Entrar</h2>
      <form id="form-login" novalidate>
        <div class="campo">
          <label for="login-email">E-mail</label>
          <input type="email" id="login-email" autocomplete="username" required />
        </div>
        <div class="campo">
          <label for="login-senha">Senha</label>
          <input type="password" id="login-senha" autocomplete="current-password" required />
        </div>
        <button type="submit" id="btn-entrar">Entrar</button>
        <p id="mensagem-login" class="mensagem" role="status" aria-live="polite"></p>
      </form>
    </section>

    <!-- Painel: vazio no HTML; os dados só chegam do banco depois do login de um administrador -->
    <div id="painel" hidden>
      <section class="cartao">
        <div class="admin-topo">
          <div class="admin-total">
            <strong id="total-eleitores">0</strong>
            <span>eleitores cadastrados</span>
          </div>
          <div class="admin-acoes">
            <button type="button" id="btn-pdf-todos">Gerar PDF com todos os títulos</button>
            <button type="button" id="btn-sair" class="secundario">Sair</button>
          </div>
        </div>
        <p id="mensagem-admin" class="mensagem" role="status" aria-live="polite"></p>
      </section>

      <section class="cartao">
        <div class="campo">
          <label for="busca">Pesquisar eleitor pelo nome</label>
          <input type="search" id="busca" autocomplete="off" placeholder="Digite parte do nome" />
        </div>
        <p id="contagem-busca" class="ajuda"></p>
        <div class="tabela-rolagem">
          <table class="tabela" id="tabela-eleitores">
            <thead>
              <tr>
                <th>Nome</th>
                <th>Nascimento</th>
                <th>Inscrição</th>
                <th>Zona</th>
                <th>Seção</th>
                <th>Município</th>
                <th>Emissão</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="corpo-eleitores"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/titulo-ui.js"></script>
  <script src="js/pdf-titulos.js"></script>
  <script src="js/admin-page.js"></script>
</body>
</html>
