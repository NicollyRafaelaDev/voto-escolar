<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voto Escolar</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topo">
    <h1>Voto Escolar</h1>
    <p>Cadastro de eleitores</p>
  </header>

  <main class="container">
    <section class="cartao">
      <h2>Novo eleitor</h2>

      <form id="form-cadastro" novalidate>
        <div class="campo">
          <label for="nome">Nome completo</label>
          <input type="text" id="nome" name="nome" autocomplete="off" maxlength="120" required />
          <small class="erro" id="erro-nome"></small>
        </div>

        <div class="campo">
          <label for="nascimento">Data de nascimento</label>
          <input type="date" id="nascimento" name="nascimento" required />
          <small class="erro" id="erro-nascimento"></small>
        </div>

        <div class="campo">
          <label for="municipio">Município</label>
          <input type="text" id="municipio" value="São Joaquim de Bicas - MG" readonly disabled />
        </div>

        <button type="submit" id="btn-salvar">Cadastrar eleitor</button>
        <p id="mensagem" class="mensagem" role="status" aria-live="polite"></p>
      </form>
    </section>

    <section class="cartao" id="secao-titulo" hidden>
      <h2>Título digital</h2>
      <div id="titulo-container"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <script src="config.js"></script>
  <script src="titulo-ui.js"></script>
  <script src="app.js"></script>
</body>
</html>
